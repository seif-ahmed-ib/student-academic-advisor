<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700" role="img" aria-labelledby="title desc">
  <title id="title">Student Academic Advisor Part A inference network</title>
  <desc id="desc">Six production-rule lanes connecting five initial fuzzy facts to three intermediate conclusions and three final conclusions using AND, OR, and NOT gates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <style>.bg{fill:#fff}.title{font:700 40px Arial,sans-serif;fill:#0f172a}.subtitle{font:20px Arial,sans-serif;fill:#475569}.legend{font:600 18px Arial,sans-serif;fill:#0f172a}.lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:9 7;rx:12}.rule{font:700 26px Arial,sans-serif;fill:#7c2d12}.condition{font:18px Arial,sans-serif;fill:#475569}.label{font:600 17px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.minor{font:15px Arial,sans-serif;fill:#475569;text-anchor:middle}.gate-text{font:700 16px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.fact{fill:#e0f2fe;stroke:#0369a1;stroke-width:3;rx:7}.mid-box{fill:#f5f3ff;stroke:#6d28d9;stroke-width:3;rx:7}.mid-circle{fill:#ddd6fe;stroke:#6d28d9;stroke-width:3}.final{fill:#dcfce7;stroke:#15803d;stroke-width:4}.gate{fill:#475569;stroke:#1e293b;stroke-width:3}.edge{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.dep{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:6}.deptext{font:700 17px Arial,sans-serif;fill:#7c2d12;text-anchor:middle}.foot{font:16px Arial,sans-serif;fill:#475569;text-anchor:middle}</style>
  </defs>
  <rect class="bg" width="2400" height="1700"/>
  <text x="1200" y="52" class="title" text-anchor="middle">Student Academic Advisor — Part A Inference Network</text>
  <text x="1200" y="88" class="subtitle" text-anchor="middle">Forward chaining • six approved production rules • exact nested AND / OR / NOT structure</text>

  <g transform="translate(95,112)">
    <rect x="0" y="0" width="220" height="62" class="fact"/><text x="110" y="38" class="legend" text-anchor="middle">Assertion / Fact</text>
    <rect x="285" y="0" width="330" height="62" class="mid-box"/><circle cx="324" cy="31" r="22" class="mid-circle"/><text x="475" y="38" class="legend" text-anchor="middle">Intermediate Conclusion</text>
    <circle cx="700" cy="31" r="29" class="final"/><text x="855" y="38" class="legend" text-anchor="middle">Final Conclusion</text>
    <circle cx="1085" cy="31" r="29" class="gate"/><text x="1085" y="32" class="gate-text">AND</text><text x="1180" y="38" class="legend" text-anchor="middle">Logic gate</text>
    <path d="M1320 31 H1430" class="edge"/><text x="1555" y="38" class="legend" text-anchor="middle">Inference flow</text>
    <rect x="1700" y="1" width="85" height="60" class="dep"/><text x="1742" y="38" class="deptext">R1</text><text x="1900" y="38" class="legend" text-anchor="middle">Rule / dependency ID</text>
  </g>

  <g transform="translate(55,215)">
    <rect width="1125" height="405" class="lane"/><text x="28" y="38" class="rule">R1 • CF 0.70</text><text x="28" y="69" class="condition">high_absence OR low_study_time → engagement_concern</text>
    <rect x="35" y="110" width="260" height="72" class="fact"/><text x="165" y="153" class="label">high_absence</text>
    <rect x="35" y="230" width="260" height="72" class="fact"/><text x="165" y="273" class="label">low_study_time</text>
    <path d="M295 146 H390 V184" class="edge"/><path d="M295 266 H390 V226" class="edge"/><circle cx="425" cy="205" r="40" class="gate"/><text x="425" y="206" class="gate-text">OR</text>
    <path d="M465 205 H575" class="edge"/><rect x="575" y="155" width="390" height="100" class="mid-box"/><circle cx="625" cy="205" r="33" class="mid-circle"/>
    <text x="795" y="195" class="label"><tspan x="795">engagement_</tspan><tspan x="795" dy="24">concern</tspan></text><text x="770" y="286" class="minor">Consumed by R3 → structurally Intermediate</text>
  </g>

  <g transform="translate(1220,215)">
    <rect width="1125" height="405" class="lane"/><text x="28" y="38" class="rule">R2 • CF 0.90</text><text x="28" y="69" class="condition">low_first_period_performance AND low_second_period_performance → persistent_low_performance</text>
    <rect x="35" y="105" width="310" height="78" class="fact"/><text x="190" y="137" class="label"><tspan x="190">low_first_period_</tspan><tspan x="190" dy="23">performance</tspan></text>
    <rect x="35" y="230" width="310" height="78" class="fact"/><text x="190" y="262" class="label"><tspan x="190">low_second_period_</tspan><tspan x="190" dy="23">performance</tspan></text>
    <path d="M345 144 H420 V184" class="edge"/><path d="M345 269 H420 V226" class="edge"/><circle cx="455" cy="205" r="40" class="gate"/><text x="455" y="206" class="gate-text">AND</text>
    <path d="M495 205 H580" class="edge"/><rect x="580" y="155" width="400" height="100" class="mid-box"/><circle cx="630" cy="205" r="33" class="mid-circle"/>
    <text x="810" y="195" class="label"><tspan x="810">persistent_low_</tspan><tspan x="810" dy="24">performance</tspan></text><text x="780" y="286" class="minor">Consumed by R3 → structurally Intermediate</text>
  </g>

  <g transform="translate(55,650)">
    <rect width="1125" height="405" class="lane"/><text x="28" y="38" class="rule">R3 • CF 0.85</text><text x="28" y="69" class="condition">persistent_low_performance AND (high_failure_history OR engagement_concern) → core_academic_risk</text>
    <rect x="25" y="105" width="275" height="88" class="mid-box"/><circle cx="67" cy="149" r="28" class="mid-circle"/><text x="190" y="140" class="label"><tspan x="190">persistent_low_</tspan><tspan x="190" dy="23">performance</tspan></text><text x="162" y="215" class="minor">from R2</text>
    <rect x="25" y="270" width="275" height="72" class="fact"/><text x="162" y="313" class="label">high_failure_history</text>
    <rect x="345" y="250" width="260" height="92" class="mid-box"/><circle cx="386" cy="296" r="28" class="mid-circle"/><text x="495" y="287" class="label"><tspan x="495">engagement_</tspan><tspan x="495" dy="23">concern</tspan></text><text x="475" y="365" class="minor">from R1</text>
    <path d="M300 306 V380 H650 V321" class="edge"/><path d="M605 296 H650 V279" class="edge"/><circle cx="685" cy="300" r="40" class="gate"/><text x="685" y="301" class="gate-text">OR</text><text x="685" y="360" class="minor">inner gate</text>
    <path d="M300 149 H785 V184" class="edge"/><path d="M685 260 V225 H785 V226" class="edge"/><circle cx="820" cy="205" r="40" class="gate"/><text x="820" y="206" class="gate-text">AND</text>
    <path d="M860 205 H900" class="edge"/><rect x="900" y="155" width="200" height="100" class="mid-box"/><circle cx="940" cy="205" r="30" class="mid-circle"/><text x="1020" y="195" class="label"><tspan x="1020">core_academic_</tspan><tspan x="1020" dy="23">risk</tspan></text><text x="995" y="286" class="minor">Consumed by R6</text>
  </g>

  <g transform="translate(1220,650)">
    <rect width="1125" height="405" class="lane"/><text x="28" y="38" class="rule">R4 • CF 0.60</text><text x="28" y="69" class="condition">high_absence AND NOT (low_first_period_performance OR low_second_period_performance)</text>
    <rect x="25" y="105" width="230" height="70" class="fact"/><text x="140" y="147" class="label">high_absence</text>
    <rect x="25" y="230" width="260" height="72" class="fact"/><text x="155" y="260" class="label"><tspan x="155">low_first_period_</tspan><tspan x="155" dy="22">performance</tspan></text>
    <rect x="315" y="230" width="270" height="72" class="fact"/><text x="450" y="260" class="label"><tspan x="450">low_second_period_</tspan><tspan x="450" dy="22">performance</tspan></text>
    <path d="M285 266 V350 H625 V321" class="edge"/><path d="M585 266 H625 V279" class="edge"/><circle cx="660" cy="300" r="40" class="gate"/><text x="660" y="301" class="gate-text">OR</text>
    <path d="M700 300 H748" class="edge"/><circle cx="790" cy="300" r="40" class="gate"/><text x="790" y="301" class="gate-text">NOT</text>
    <path d="M255 140 H860 V184" class="edge"/><path d="M790 260 V225 H860 V226" class="edge"/><circle cx="895" cy="205" r="40" class="gate"/><text x="895" y="206" class="gate-text">AND</text>
    <path d="M935 205 H970" class="edge"/><circle cx="1030" cy="205" r="58" class="final"/><text x="1030" y="196" class="label"><tspan x="1030">attendance</tspan><tspan x="1030" dy="22">support</tspan></text><text x="1000" y="292" class="minor">attendance_based_support_need • Final</text>
  </g>

  <g transform="translate(55,1085)">
    <rect width="1125" height="405" class="lane"/><text x="28" y="38" class="rule">R5 • CF 0.65</text><text x="28" y="69" class="condition">low_second_period_performance AND NOT low_first_period_performance → emerging_performance_support_need</text>
    <rect x="35" y="105" width="310" height="78" class="fact"/><text x="190" y="137" class="label"><tspan x="190">low_second_period_</tspan><tspan x="190" dy="23">performance</tspan></text>
    <rect x="35" y="240" width="310" height="78" class="fact"/><text x="190" y="272" class="label"><tspan x="190">low_first_period_</tspan><tspan x="190" dy="23">performance</tspan></text>
    <path d="M345 279 H410" class="edge"/><circle cx="450" cy="279" r="40" class="gate"/><text x="450" y="280" class="gate-text">NOT</text>
    <path d="M345 144 H555 V184" class="edge"/><path d="M490 279 H555 V226" class="edge"/><circle cx="590" cy="205" r="40" class="gate"/><text x="590" y="206" class="gate-text">AND</text>
    <path d="M630 205 H785" class="edge"/><circle cx="855" cy="205" r="68" class="final"/><text x="855" y="196" class="label"><tspan x="855">emerging</tspan><tspan x="855" dy="22">support need</tspan></text><text x="855" y="303" class="minor">emerging_performance_support_need • Final</text>
  </g>

  <g transform="translate(1220,1085)">
    <rect width="1125" height="405" class="lane"/><text x="28" y="38" class="rule">R6 • CF 0.90</text><text x="28" y="69" class="condition">core_academic_risk OR (high_failure_history AND low_study_time) → compounded_academic_support_need</text>
    <rect x="25" y="105" width="275" height="88" class="mid-box"/><circle cx="67" cy="149" r="28" class="mid-circle"/><text x="190" y="140" class="label"><tspan x="190">core_academic_</tspan><tspan x="190" dy="23">risk</tspan></text><text x="162" y="215" class="minor">from R3</text>
    <rect x="25" y="270" width="275" height="72" class="fact"/><text x="162" y="313" class="label">high_failure_history</text><rect x="345" y="270" width="240" height="72" class="fact"/><text x="465" y="313" class="label">low_study_time</text>
    <path d="M300 306 V380 H625 V321" class="edge"/><path d="M585 306 H625 V279" class="edge"/><circle cx="660" cy="300" r="40" class="gate"/><text x="660" y="301" class="gate-text">AND</text><text x="660" y="360" class="minor">inner gate</text>
    <path d="M300 149 H770 V184" class="edge"/><path d="M660 260 V225 H770 V226" class="edge"/><circle cx="805" cy="205" r="40" class="gate"/><text x="805" y="206" class="gate-text">OR</text>
    <path d="M845 205 H905" class="edge"/><circle cx="980" cy="205" r="68" class="final"/><text x="980" y="196" class="label"><tspan x="980">compounded</tspan><tspan x="980" dy="22">support need</tspan></text><text x="950" y="303" class="minor">compounded_academic_support_need • Final</text>
  </g>

  <text x="1200" y="1535" class="subtitle" text-anchor="middle">Rule dependency chain</text>
  <g transform="translate(855,1555)"><rect x="0" y="0" width="100" height="48" class="dep"/><text x="50" y="31" class="deptext">R1</text><rect x="0" y="64" width="100" height="48" class="dep"/><text x="50" y="95" class="deptext">R2</text><path d="M100 24 H210 V48 H270" class="edge"/><path d="M100 88 H210 V64 H270" class="edge"/><rect x="270" y="32" width="100" height="48" class="dep"/><text x="320" y="63" class="deptext">R3</text><path d="M370 56 H510" class="edge"/><rect x="510" y="32" width="100" height="48" class="dep"/><text x="560" y="63" class="deptext">R6</text></g>
  <text x="1200" y="1680" class="foot">Repeated premise nodes denote the same Knowledge Base attribute; rule lanes prevent ambiguous crossing lines. Shapes—not colors—define semantic type.</text>
</svg>
